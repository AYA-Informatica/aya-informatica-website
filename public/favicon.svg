<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The tile stays navy in both schemes: it is the brand mark, and navy reads
       against light and dark browser chrome alike. Only the accent lifts in
       dark, where the darker blue muddies against the tile. -->
  <style>
    .accent { fill: #0A84FF; }
    @media (prefers-color-scheme: dark) { .accent { fill: #3B9BFF; } }
  </style>
  <rect width="32" height="32" rx="6" fill="#001529"/>
  <text x="16" y="17.5" font-family="Georgia, 'Times New Roman', serif" font-weight="900"
    font-size="13" fill="#ffffff" text-anchor="middle" letter-spacing="-0.8">AYA</text>
  <rect class="accent" x="9" y="20.5" width="14" height="1.5" rx="0.75"/>
  <text class="accent" x="16" y="29" font-family="Arial, Helvetica, sans-serif" font-weight="700"
    font-size="7.5" text-anchor="middle" letter-spacing="0.5">RW</text>
</svg>

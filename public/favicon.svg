<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Stacked lockup rather than the logo's side-by-side roundel: at 32px a
       roundel beside "AYA" either clips the wordmark or overlaps it. -->
  <rect width="32" height="32" rx="6" fill="#001529"/>
  <text x="16" y="17.5" font-family="Georgia, 'Times New Roman', serif" font-weight="900"
    font-size="13" fill="#ffffff" text-anchor="middle" letter-spacing="-0.8">AYA</text>
  <rect x="9" y="20.5" width="14" height="1.5" rx="0.75" fill="#0A84FF"/>
  <text x="16" y="29" font-family="Arial, Helvetica, sans-serif" font-weight="700"
    font-size="7.5" fill="#0A84FF" text-anchor="middle" letter-spacing="0.5">RW</text>
</svg>
